<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Float Manager</title>
<link rel="stylesheet" href="fonts/fonts.css">

<style>
/* Layout idea: one phone-width column, deep-teal hero card on a warm paper ground, white tool cards, green = money in, red = money out. Single light theme by choice. */
:root{
  color-scheme:light;
  --paper:#fbf6f2; --card:#ffffff; --line:#efe7e1; --field:#f7ece5;
  --teal:#0c474b; --teal-2:#0a3a3e; --cream:#f0dba6;
  --green:#12955a; --green-soft:#e3f4eb; --red:#e23a3f; --red-soft:#fde9e9;
  --amber:#b7791f; --amber-soft:#fdf1d8;
  --ink:#17201f; --muted:#8b8f8d; --mid:#5c6462;
  --display:"DM Serif Display","IBM Plex Sans Arabic",Georgia,serif;
  --body:"Manrope","IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--paper)}
#top{display:flex;align-items:center;gap:10px;padding:14px 18px 8px;min-height:56px}
#top h1{font-size:17px;font-weight:700;margin:0;flex:1;text-wrap:balance}
.mark{width:32px;height:32px;border-radius:9px;overflow:hidden;flex:none;display:block}.mark svg{display:block}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--line)}
[dir=rtl] .flip{transform:scaleX(-1)}
#view{flex:1;overflow-y:auto;padding:6px 18px 24px;display:flex;flex-direction:column;gap:14px}
#nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;font-weight:600}
#nav button span.ic{padding:3px 16px;border-radius:999px;display:grid;place-items:center}
#nav button.on{color:var(--green)}
#nav button.on span.ic{background:var(--green-soft)}
.hero{background:linear-gradient(160deg,var(--teal),var(--teal-2));border-radius:20px;padding:20px;color:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 24px -14px rgba(12,71,75,.7)}
.hero .ttl{font-family:var(--display);color:var(--cream);font-size:24px;line-height:1.15;text-wrap:balance}
.hero .lbl{font-size:12px;opacity:.75}
.hero .big{font-family:var(--display);font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums;color:#fff}
.hero .big small{font-family:var(--body);font-size:14px;opacity:.7;font-weight:600}
.hero .pills{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{background:#fff;color:var(--teal);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:4px 2px -4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px;font-weight:700;font-size:13.5px;min-height:92px;justify-content:space-between}
.tool:hover{border-color:#dfd3ca}
.tool .tic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.tool small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.c-blue{background:#e8effd;color:#3b6fe0}.c-red{background:var(--red-soft);color:var(--red)}.c-green{background:var(--green-soft);color:var(--green)}.c-violet{background:#eeeafd;color:#6b55d9}.c-amber{background:var(--amber-soft);color:var(--amber)}.c-teal{background:#dff0ef;color:var(--teal)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bal{text-align:center;display:flex;flex-direction:column;gap:4px}
.bal .n{font-size:12px;color:var(--mid)}
.bal .v small{font-size:14px;color:var(--mid);font-weight:600}
.bal .v.out{color:var(--red)}
.bal .v{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bal .split{display:grid;grid-template-columns:1fr 1fr;margin-top:8px}
.bal .split div+div{border-inline-start:1px solid var(--line)}
.bal .split b{display:block;font-variant-numeric:tabular-nums}
.bal .split span{font-size:11.5px;color:var(--mid)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border-radius:999px;padding:12px 16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;min-height:46px}
.btn.green,.btn.in{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.soft{background:var(--green-soft);color:var(--green)}
.btn.block{border-radius:12px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn .circ{width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center}
.btn.red .circ{color:var(--red)}.btn.in .circ,.btn.green .circ{color:var(--green)}
.search{background:var(--field);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--green)}
.search input{flex:1;border:0;background:none;padding:13px 0;outline:none;color:var(--ink);min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;width:100%}
.row:hover{border-color:#dfd3ca}
.row .g{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--green)}.out{color:var(--red)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st-draft{background:var(--line);color:var(--mid)}.st-submitted{background:var(--amber-soft);color:var(--amber)}.st-approved{background:var(--green-soft);color:var(--green)}.st-returned{background:var(--red-soft);color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:26px 12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:14px;padding:12px;border:1px solid var(--line);background:var(--card)}
.tile span{font-size:11.5px;color:var(--mid)}.tile b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.tile.r{background:var(--red-soft);border-color:#f6cfcf}.tile.r b{color:var(--red)}
.tile.g{background:var(--green-soft);border-color:#c5e6d4}.tile.g b{color:var(--green)}
.note{font-size:13px;color:var(--mid);background:var(--field);border-radius:12px;padding:10px 12px}
.note.warn{background:var(--amber-soft);color:#7a5210}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--mid)}
.inp{background:var(--field);border:1px solid transparent;border-radius:12px;padding:12px;font-size:15px;width:100%;color:var(--ink);font-weight:500}
.inp:focus{outline:none;border-color:var(--green);background:#fff}
.amtinp{font-size:30px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:999px;padding:4px}
.seg button{border-radius:999px;padding:9px;text-align:center;font-weight:700;color:var(--mid)}
.seg button.on.o{background:var(--red);color:#fff}.seg button.on.i{background:var(--green);color:#fff}.seg button.on.n{background:var(--teal);color:#fff}
#sheet{position:fixed;inset:0;background:rgba(15,25,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#sheet[hidden]{display:none}
#sheet .box{background:var(--paper);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px}
#sheet .hd{display:flex;align-items:center;gap:8px}
#sheet .hd h2{flex:1;margin:0;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
[dir=rtl] .chip{padding:6px 12px 6px 6px}
.chip button{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:var(--mid);font-size:14px;line-height:1}
.inline{display:flex;gap:8px}.inline .inp{flex:1;min-width:0}
.thumb{max-width:100%;max-height:220px;border-radius:12px;border:1px solid var(--line);display:block}
.attach{border:1.5px dashed #d9c9bd;border-radius:12px;padding:12px;text-align:center;color:var(--mid);font-weight:600;cursor:pointer;font-size:13.5px}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:30;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
table.lines{width:100%;border-collapse:collapse;font-size:13px}
table.lines th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:start;padding:6px 4px;border-bottom:1px solid var(--line)}
table.lines td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.lines td.num,table.lines th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>
<div id="sheet" hidden></div>
<div id="toast" role="status"></div>

  const mine=txs.filter(x=>x.acc===rep.acc);

  const inside=mine.filter(x=>x.date>=rep.from&&x.date<=rep.to).sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
  const s=sums(inside);
  return{title:rep.title,org:main.org||"",accName:rep.acc==="col"?(T[main.lang]||T.en).collections:(main.accounts.find(a=>a.id===rep.acc)||{}).name||"",from:rep.from,to:rep.to,cur:main.cur||"SAR",lang:main.lang||"en",
    opening:before,tin:s.in,tout:s.out,closing:before+s.bal,
    lines:inside.map(x=>x.acc==="col"?{id:x.id,date:x.date,desc:[x.party,x.desc].filter(Boolean).join(" · "),cat:(T[main.lang]||T.en)["k_"+x.kind],cc:x.ref||"",type:x.type,amt:x.amt,att:!!x.att}:{id:x.id,date:x.date,desc:x.desc||"",cat:x.cat||"",cc:x.cc||"",type:x.type,amt:x.amt,att:!!x.att})}}

  get(s,k){return this.run(s,"readonly",o=>o.get(k))},put(s,k,v){return this.run(s,"readwrite",o=>o.put(v,k))},del(s,k){return this.run(s,"readwrite",o=>o.delete(k))},

const A={
tab:d=>{if(d.k==="team")S.team=null;go(d.k)},
back:()=>{const v=S.sub&&S.sub.v;if(v==="acc"){S.sub=null;S.tab="accounts"}else if(v){S.sub=null}else S.tab="home";S.q="";render()},
goAccounts:()=>go("accounts"),goReports:()=>go("reports"),goTeam:()=>{S.team=null;go("team")},
goCats:()=>{go("prefs");const e=$("#sec-cats");e&&e.scrollIntoView()},goCcs:()=>{go("prefs");const e=$("#sec-ccs");e&&e.scrollIntoView()},
xlsAll:()=>exportAll(),
openAcc:d=>{S.sub={v:"acc",id:d.id};render()},
newAcc:()=>simpleSheet(t("newAcc"),t("accName"),"",v=>{S.main.accounts.push({id:uidGen("a"),name:v});Store.save("main")}),
renameAcc:d=>simpleSheet(t("rename"),t("accName"),accName(d.id),v=>{S.main.accounts.find(a=>a.id===d.id).name=v;Store.save("main")}),
delAcc:(d,el)=>{if(allTx().some(x=>x.acc===d.id)||S.main.accounts.length<2){toast(t("accHasTx"));return}
  if(!el.dataset.arm){el.dataset.arm=1;el.textContent=t("delAgain");return}
  S.main.accounts=S.main.accounts.filter(a=>a.id!==d.id);S.main.reports=S.main.reports.filter(r=>r.acc!==d.id);Store.save("main");S.sub=null;S.tab="accounts";render()},
newTx:d=>txSheet({id:uidGen("t"),type:d.type,amt:0,desc:"",date:today(),acc:d.acc||(S.sub&&S.sub.v==="acc"?S.sub.id:S.main.accounts[0].id),cat:"",cc:"",att:false},true),
editTx:d=>{let x=findTx(d.id);if(x&&x.link)x=findTx(x.link);if(!x)return;x.acc==="col"?colSheet(x,false):txSheet(x,false)},
goCol:()=>{S.tab="home";S.sub={v:"col"};S.q="";render()},
newCol:d=>colSheet({id:uidGen("c"),acc:"col",kind:d.kind,type:d.kind==="col"?"in":"out",amt:0,party:"",ref:"",desc:"",date:today(),to:S.main.accounts[0].id,att:false},true),
delCol:(d,el)=>{if(!el.dataset.arm){el.dataset.arm=1;el.textContent=t("delAgain");return}
  const x=findTx(sheetState.x.id);if(x){dropTx(x);if(x.att)Store.delAtt(x.id);const l=findTx(x.id+"f");if(l)dropTx(l)}closeSheet();toast(t("deleted"));render()},
txType:(d,el)=>{sheetState.x.type=d.type;el.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===el))},
rmAtt:()=>{sheetState.att=null;drawAtt(null)},
delTx:(d,el)=>{if(!el.dataset.arm){el.dataset.arm=1;el.textContent=t("delAgain");return}
  const x=findTx(sheetState.x.id);if(x){dropTx(x);if(x.att)Store.delAtt(x.id)}closeSheet();toast(t("deleted"));render()},
closeSheet:()=>closeSheet(),
seed:()=>{const d=new Date(),day=n=>{const z=new Date(d);z.setDate(d.getDate()-n);return z.getFullYear()+"-"+String(z.getMonth()+1).padStart(2,"0")+"-"+String(z.getDate()).padStart(2,"0")},m=S.main,a=m.accounts[0].id;
  [["in",200000,9,lang()==="ar"?"عهدة من الشركة":"Float received from office","",0],["out",18500,7,m.cats[0],m.cats[0],1],["out",6400,5,m.cats[2],m.cats[2],1],["out",32000,3,m.cats[5]||m.cats[0],m.cats[5]||"",2],["out",4500,1,m.cats[1],m.cats[1],1]]
  .forEach((r,i)=>putTx({id:uidGen("t")+i,type:r[0],amt:r[1],date:day(r[2]),desc:r[3],cat:r[4],cc:m.ccs[r[5]]||"",acc:a,att:false,ts:Date.now()+i,ex:true}));render()},
rmSeed:()=>{allTx().filter(x=>x.ex).forEach(dropTx);render()},
newRep:()=>repSheet(),
openRep:d=>{S.sub={v:"report",id:d.id};render()},
delRep:(d,el)=>{if(!el.dataset.arm){el.dataset.arm=1;el.textContent=t("delAgain");return}
  S.main.reports=S.main.reports.filter(r=>r.id!==S.sub.id);Store.save("main");S.sub=null;render()},
pdf:()=>{const c=currentR();exportPdf(c.R,c.get).catch(()=>toast(t("dlFail")))},
xls:()=>exportXlsx(currentR().R),
sendRep:async(d,el)=>{if(!Store.db){toast(t("sendNeeds"));return}el.disabled=true;const id=S.sub.id,c=currentR();
  try{await Store.submit(id,c.R);S.shared[id]={status:"submitted",note:""};toast(t("sent"))}catch(e){Store.fail(e)}render()},
openTeam:d=>{S.sub={v:"treport",i:+d.i};render()},
review:async(d,el)=>{const R=S.team[S.sub.i],note=$("#mnote").value.trim();el.disabled=true;
  try{await Store.review(R.uid,R.rid,{status:d.s,note,reviewedAt:new Date().toISOString()});R.status=d.s;R.note=note;if(R.uid===Store.uid)S.shared[R.rid]={status:d.s,note};toast(t("saved"))}catch(e){Store.fail(e)}
  S.sub=null;render()},
backup:async()=>{toast(t("building"));let att={};try{att=Store.idb?await IDB.all("att"):{}}catch(e){}
  saveFile("float-manager-backup-"+today()+".json",new Blob([JSON.stringify({app:"float-manager",v:1,saved:new Date().toISOString(),main:S.main,months:S.months,att})],{type:"application/json"}))},
restoreGo:async(d,el)=>{const b=sheetState.b;el.disabled=true;
  try{S.main=b.main;S.months=b.months||{};if(Store.idb){await IDB.clear("att");for(const k in (b.att||{}))await IDB.put("att",k,b.att[k])}Store.save("main");closeSheet();toast(t("restored"));go("home")}catch(e){toast(t("saveFail"));el.disabled=false}},
lang:d=>{S.main.lang=d.l;Store.save("main");render()},
rmItem:d=>{S.main[d.k].splice(+d.i,1);Store.save("main");render()}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el){if(el.tagName==="BUTTON"&&el.type!=="submit"||el.tagName!=="BUTTON")e.preventDefault();A[el.dataset.a]&&A[el.dataset.a](el.dataset,el);return}
  if(e.target.id==="sheet")closeSheet()});
document.addEventListener("input",e=>{if(e.target.id==="cq"){S.q=e.target.value;$("#collist").innerHTML=colList(colTx())}
  if(e.target.id==="q"){S.q=e.target.value;const id=S.sub.id;$("#txlist").innerHTML=accList(allTx().filter(x=>x.acc===id))}});
document.addEventListener("change",async e=>{const el=e.target;
  if(el.id==="f-att"&&el.files[0]){try{const d=await shrink(el.files[0]);sheetState.att=d;drawAtt(d)}catch(err){toast(t("photoBig"))}}
  if(el.id==="f-restore"&&el.files[0]){let b=null;try{b=JSON.parse(await el.files[0].text())}catch(err){}
    if(!b||b.app!=="float-manager"||!b.main||!Array.isArray(b.main.accounts)){toast(t("badBackup"));el.value="";return}
    let n=0;for(const k in (b.months||{}))n+=Object.keys(b.months[k].items||{}).length;
    sheetState={b};openSheet(t("restoreT"),`<div class="note warn">${t("restoreQ")} <b>${esc(fdate((b.saved||"").slice(0,10)))}</b> · ${n} ${t("entriesN")} · ${Object.keys(b.att||{}).length} ${t("photosN")}</div><button class="btn red block" data-a="restoreGo">${t("restoreGo")}</button><button class="btn ghost block" data-a="closeSheet">${t("cancel")}</button>`)}
  if(el.dataset.set){const v=el.value.trim();S.main[el.dataset.set]=el.dataset.set==="cur"?(v||"SAR"):v;Store.save("main")}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,k=f.dataset.form,fd=new FormData(f);
  if(k==="tx"){const st=sheetState,amt=parseAmt(fd.get("amt"));if(!amt){toast(t("needAmt"));$("#f-amt").focus();return}
    const old=st.isNew?null:findTx(st.x.id),x={...st.x,amt,desc:String(fd.get("desc")).trim(),date:fd.get("date")||today(),acc:fd.get("acc"),cat:fd.get("cat"),cc:fd.get("cc"),ts:st.x.ts||Date.now()};
    const btn=f.querySelector("button.green");btn.disabled=true;
    try{if(st.att){await Store.putAtt(x.id,st.att);x.att=true}else if(st.att===null&&x.att){await Store.delAtt(x.id);x.att=false}}catch(err){Store.fail(err);btn.disabled=false;return}
    if(old&&old.date.slice(0,7)!==x.date.slice(0,7))dropTx(old);putTx(x);closeSheet();toast(t("saved"));render()}
  if(k==="col"){const st=sheetState,amt=parseAmt(fd.get("amt"));if(!amt){toast(t("needAmt"));$("#f-amt").focus();return}
    const old=st.isNew?null:findTx(st.x.id),g=n=>String(fd.get(n)||"").trim();
    const x={...st.x,amt,party:g("party"),ref:g("ref"),desc:g("desc"),date:fd.get("date")||today(),to:fd.get("to")||st.x.to,ts:st.x.ts||Date.now()};
    const btn=f.querySelector("button.green");btn.disabled=true;
    try{if(st.att){await Store.putAtt(x.id,st.att);x.att=true}else if(st.att===null&&x.att){await Store.delAtt(x.id);x.att=false}}catch(err){Store.fail(err);btn.disabled=false;return}
    if(old&&old.date.slice(0,7)!==x.date.slice(0,7))dropTx(old);
    if(x.kind==="flt"){const lid=x.id+"f",ol=findTx(lid);if(ol&&ol.date.slice(0,7)!==x.date.slice(0,7))dropTx(ol);
      putTx({id:lid,link:x.id,type:"in",acc:x.to,amt,date:x.date,desc:t("floatFrom"),cat:"",cc:"",att:false,ts:x.ts})}
    putTx(x);const over=sums(colTx()).bal<0;closeSheet();toast(t(over?"overCol":"saved"));render()}
  if(k==="simple"){const v=String(fd.get("v")).trim();if(!v)return;const cb=sheetState.cb;closeSheet();cb(v);render()}
  if(k==="rep"){let from=fd.get("from"),to=fd.get("to");if(from>to)[from,to]=[to,from];
    const r={id:uidGen("r"),title:String(fd.get("title")).trim()||t("repDefault"),acc:fd.get("acc"),from,to,created:today()};S.main.reports.push(r);Store.save("main");closeSheet();S.tab="reports";S.sub={v:"report",id:r.id};render()}
  if(k==="addItem"){const key=f.dataset.k,v=String(fd.get("v")).trim();if(!v)return;if(S.main[key].includes(v)){toast(t("exists"));return}S.main[key].push(v);Store.save("main");render();const i=$("#add-"+key);i&&i.focus()}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(S.main&&["home","accounts","reports","team","prefs"].includes(h)&&(h!==S.tab||S.sub)){if(h==="team"&&!(Store.mgr&&Store.db))return;S.tab=h;S.sub=null;render()}});

window.nativeBack=()=>{if(!$("#sheet").hidden){closeSheet();return true}if(S.main&&(S.sub||S.tab!=="home")){A.back();return true}return false};
/* ---------- boot ---------- */
async function boot(){setDir();$("#top").innerHTML=`<div class="mark">${LOGO}</div><h1>${t("app")}</h1>`;$("#nav").innerHTML="";
  $("#view").innerHTML=`<div class="card empty">${t("loading")}</div>`;
  const unreach=()=>{$("#view").innerHTML=`<div class="card empty">${t("unreach")}<button class="btn soft" data-a="retry">${t("retry")}</button></div>`};
  const timer=setTimeout(unreach,12000);
  try{if(!Store.inited){await Store.init();Store.inited=true}await Store.load()}catch(e){clearTimeout(timer);unreach();return}
  clearTimeout(timer);const h=location.hash.slice(1);if(["accounts","reports","prefs"].includes(h))S.tab=h;render()}
A.retry=()=>boot();
boot();
</script>
</body>
</html>

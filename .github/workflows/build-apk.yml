name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Bundle the web app into the APK assets
        run: python3 tools/build_assets.py
      - name: Build signed APK
        run: gradle --no-daemon assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk FloatManager.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FloatManager-apk
          path: FloatManager.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Float Manager 1.0.${{ github.run_number }}
          body: Install FloatManager.apk on your Android phone. It installs over the previous version and keeps your data.
          files: FloatManager.apk
          make_latest: true
